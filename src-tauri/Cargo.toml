[package]
name = "project-write"
version = "0.1.0"
description = "Project Write – local, cross-platform writing and knowledge management"
edition = "2024"
rust-version = "1.89"
publish = false

[lib]
name = "project_write_lib"
crate-type = ["rlib"]

[[bin]]
name = "project-write"
path = "src/main.rs"

[features]
# Debug-only end-to-end test support (embedded WebDriver server).
# Never enabled for release builds: see src/lib.rs and the CI release check.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22.1"
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.35"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
tauri-plugin-single-instance = "2.5.5"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
sha2 = "0.10.9"
flate2 = "1.1.10"
# Media (Phase 8, ADR 0019): decoding with limits and thumbnails; only the
# four raster formats of section 17, without threads.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Office check: reads [Content_Types].xml and the part names.
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2"] }
time = "0.3.55"
tokio = { version = "1", features = ["sync", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# Dependencies need no debug info in debug builds; this keeps target/ small
# (our own crate keeps full debug info).
[profile.dev.package."*"]
debug = false

# Debug builds (tests, E2E) hash and query noticeably faster with optimised
# SHA-256 and SQLite; behaviour is unchanged.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Temporary (ADR 0018): sqlx-sqlite 0.9.0 accepts libsqlite3-sys only below
# 0.38, whose bundled SQLite (before 3.54.0) is affected by RUSTSEC-2026-0459.
# The vendored copy differs from the published crate in that one range only
# (">=0.39.0, <0.40.0", SQLite 3.54.1). Remove it once an sqlx release
# accepts libsqlite3-sys 0.39.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
