name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is paused by the client (2 November 2026); priority: Windows, then Linux.
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb dbus bpftrace

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Format (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Frontend tests (Vitest)
        run: npm test

      - name: Network test evaluation (node:test)
        run: node --test scripts/network-check.test.mjs

      - name: Format (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint (Clippy)
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features e2e -- -D warnings

      - name: Rust tests
        shell: bash
        # The generated types are deleted first, so the next step only passes if
        # the tests wrote them again into src/types/generated (.cargo/config.toml).
        run: |
          rm -rf src/types/generated
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Reference library is reproducible
        shell: bash
        # Built twice, fingerprints compared (section 25, Phase 2). Full size
        # on Linux; Windows syncs every file and gets a smaller library.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            node scripts/reference-library.mjs --check
          else
            node scripts/reference-library.mjs --check --documents 1000
          fi

      - name: Generated TypeScript types are up to date
        shell: bash
        run: |
          git add --intent-to-add src/types/generated
          git diff --exit-code -- src/types/generated

      - name: Third-party license list is up to date
        shell: bash
        run: |
          node scripts/third-party-licenses.mjs
          git diff --exit-code -- THIRD-PARTY-LICENSES

      - name: Build debug app with end-to-end support
        run: npm run build:e2e

      - name: Start the network recorder (Linux)
        if: runner.os == 'Linux'
        # Normal operation makes no network connection (sections 2 and 20,
        # ADR 0028). bpftrace records in the kernel every address the app
        # and its child processes connect or send to during the E2E suite;
        # the app itself runs unchanged (docs/sicherheit.md). If the recorder
        # cannot start, the E2E tests still run and "Network test" fails.
        continue-on-error: true
        run: sh scripts/network-record-linux.sh start tests/e2e/.network/linux.txt

      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        # A D-Bus session: tauri-plugin-single-instance finds the running
        # instance through it (tests/e2e/specs/restart.e2e.ts).
        run: dbus-run-session -- xvfb-run -a npm run test:e2e

      - name: End-to-end tests (Windows, macOS)
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Network test (Linux)
        # Also after a failed E2E run: the recording is evaluated either way.
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          sh scripts/network-record-linux.sh stop tests/e2e/.network/linux.txt
          node scripts/network-check.mjs linux tests/e2e/.network/linux.txt

      - name: Network test (Windows, sampled, report only)
        if: runner.os == 'Windows'
        # Samples TCP/UDP of the app's process tree and its DNS queries during
        # a second run of the suite. Sampling misses short connections, so
        # this step only reports (docs/sicherheit.md).
        continue-on-error: true
        shell: pwsh
        run: |
          $out = 'tests/e2e/.network/windows.jsonl'
          $stop = Join-Path $env:RUNNER_TEMP 'network-watch.stop'
          $watch = Start-Process pwsh -PassThru -NoNewWindow -ArgumentList '-NoProfile', '-File', 'scripts/network-watch-windows.ps1', '-Out', $out, '-StopFile', $stop
          npm run test:e2e
          $e2e = $LASTEXITCODE
          New-Item -ItemType File -Path $stop | Out-Null
          $watch.WaitForExit(120000) | Out-Null
          node scripts/network-check.mjs windows $out
          if ($e2e -ne 0) { Write-Output "::warning::the E2E suite failed during the network sampling (exit $e2e)" }

  release-check:
    name: Release build contains no test plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: The e2e feature is refused in release builds
        run: |
          if cargo check --manifest-path src-tauri/Cargo.toml --release --features e2e 2>err.txt; then
            echo "::error::release build with the e2e feature must fail"; exit 1
          fi
          grep -q "must never be part of a release build" err.txt

      - name: Build release binary
        run: npx tauri build --no-bundle

      - name: Scan release dependency graph and binary for test plugins
        run: bash scripts/check-release-no-test-plugins.sh src-tauri/target/release/project-write

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

      - name: cargo deny
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

      - run: npm ci --ignore-scripts

      - name: npm audit (shipped dependencies, blocking)
        run: npm audit --omit=dev

      - name: npm audit (development tools, report only – see docs/dependencies.md)
        continue-on-error: true
        run: npm audit
