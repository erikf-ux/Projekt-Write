name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is paused by the client (2 November 2026); priority: Windows, then Linux.
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb dbus

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Format (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Frontend tests (Vitest)
        run: npm test

      - name: Format (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint (Clippy)
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features e2e -- -D warnings

      - name: Rust tests
        shell: bash
        # The generated types are deleted first, so the next step only passes if
        # the tests wrote them again into src/types/generated (.cargo/config.toml).
        run: |
          rm -rf src/types/generated
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Reference library is reproducible
        shell: bash
        # Built twice, fingerprints compared (section 25, Phase 2). Full size
        # on Linux; Windows syncs every file and gets a smaller library.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            node scripts/reference-library.mjs --check
          else
            node scripts/reference-library.mjs --check --documents 1000
          fi

      - name: Generated TypeScript types are up to date
        shell: bash
        run: |
          git add --intent-to-add src/types/generated
          git diff --exit-code -- src/types/generated

      - name: Third-party license list is up to date
        shell: bash
        run: |
          node scripts/third-party-licenses.mjs
          git diff --exit-code -- THIRD-PARTY-LICENSES

      - name: Build debug app with end-to-end support
        run: npm run build:e2e

      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        # A D-Bus session: tauri-plugin-single-instance finds the running
        # instance through it (tests/e2e/specs/restart.e2e.ts).
        run: dbus-run-session -- xvfb-run -a npm run test:e2e

      - name: End-to-end tests (Windows, macOS)
        if: runner.os != 'Linux'
        run: npm run test:e2e

  release-check:
    name: Release build contains no test plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: The e2e feature is refused in release builds
        run: |
          if cargo check --manifest-path src-tauri/Cargo.toml --release --features e2e 2>err.txt; then
            echo "::error::release build with the e2e feature must fail"; exit 1
          fi
          grep -q "must never be part of a release build" err.txt

      - name: Build release binary
        run: npx tauri build --no-bundle

      - name: Scan release dependency graph and binary for test plugins
        run: bash scripts/check-release-no-test-plugins.sh src-tauri/target/release/project-write

  # Phase 14, ADR 0028: unsigned installers for Windows (NSIS, MSI) and Linux
  # (deb, AppImage), no updater; macOS stays deferred.
  package:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        # patchelf and file: linuxdeploy needs them for the AppImage.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Installer licence text is up to date
        run: node scripts/installer-license.mjs --check

      - name: Build release installers (${{ matrix.bundles }})
        # Default features only: the e2e feature never reaches a release
        # build (release-check). No signing configuration (ADR 0028).
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Installer size at most 50 MB (section 6)
        # The AppImage carries WebKitGTK and ICU itself (about 150 MB
        # unpacked); it is measured and reported only (docs/installation.md).
        run: node scripts/installer-test.mjs size src-tauri/target/release/bundle --report-only AppImage

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  install-test:
    name: Install and uninstall (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    # A fresh runner without Rust, build tools or development libraries: the
    # packages must bring or declare everything themselves (section 25,
    # Phase 14: "auf einem sauberen System je Betriebssystem getestet").
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: installers

      - name: Prepare the Linux runner
        if: runner.os == 'Linux'
        # The package index for the dependencies of the .deb; xvfb and dbus
        # (dbus-run-session) only for the smoke start, neither brings
        # WebKitGTK or GTK, which the .deb must declare itself.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus

      - name: NSIS – install, check, uninstall; the library stays
        if: runner.os == 'Windows'
        run: node scripts/installer-test.mjs nsis installers

      - name: MSI – install, check, uninstall; the library stays
        if: runner.os == 'Windows'
        run: node scripts/installer-test.mjs msi installers

      - name: deb – install, check, uninstall; the library stays
        if: runner.os == 'Linux'
        run: node scripts/installer-test.mjs deb installers

      - name: AppImage – check, start, delete; the library stays
        if: runner.os == 'Linux'
        run: node scripts/installer-test.mjs appimage installers

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

      - name: cargo deny
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

      - run: npm ci --ignore-scripts

      - name: npm audit (shipped dependencies, blocking)
        run: npm audit --omit=dev

      - name: npm audit (development tools, report only – see docs/dependencies.md)
        continue-on-error: true
        run: npm audit
